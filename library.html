<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NEXUS//BOOKS — Library</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>

<header>

    <div class="logo">
        NEXUS//BOOKS
    </div>

    <nav>

        <a href="index.html">
            HOME
        </a>

        <a href="library.html">
            LIBRARY
        </a>

        <a href="about.html">
            ABOUT
        </a>

    </nav>

    <div class="status">
        ● ONLINE
    </div>

</header>


<main class="library">

    <div class="stars"></div>


    <section class="library-title">

        <p>
            DATABASE // 001
        </p>

        <h1>
            NEXUS LIBRARY
        </h1>

        <span>
            SELECT A STORY TO ENTER
        </span>

    </section>
<div class="library-search">

    <span>SEARCH DATABASE //</span>

    <input
        type="text"
        id="book-search"
        placeholder="SEARCH ARCHIVES..."
        autocomplete="off"
    >

</div>

    <section class="book-grid">


        <!-- BOOK 1 -->
    <div class="book-float">

    
        <article class="book-card">

            <div class="cover">
                <div class="cover-symbol">✦</div>
            </div>

            <h2>
                THE ALCHEMIST
            </h2>

            <p>
                PAULO COELHO
            </p>

            <a href="reader.html?book=alchemist"
               class="read-button open-book">

                READ NOW →

            </a>

        </article>

    </div>


        <!-- BOOK 2 -->
    <div class="book-float">

    
        <article class="book-card">

            <div class="cover purple">
                <div class="cover-symbol">◈</div>
            </div>

            <h2>
                ATOMIC HABITS
            </h2>

            <p>
                JAMES CLEAR
            </p>

            <a href="reader.html?book=atomic"
               class="read-button open-book">

                READ NOW →

            </a>

        </article>

    </div>
        <!-- BOOK 3 -->
    <div class="book-float">

    
        <article class="book-card">

            <div class="cover blue">
                <div class="cover-symbol">∞</div>
            </div>

            <h2>
                DEEP WORK
            </h2>

            <p>
                CAL NEWPORT
            </p>

            <a href="reader.html?book=deepwork"
               class="read-button open-book">

                READ NOW →

            </a>

        </article>

    </div>
        <!-- BOOK 4 -->
    <div class="book-float">

    
        <article class="book-card">

            <div class="cover">

                <img
                    src="images/covers/unwritten.png"
                    alt="The Unwritten One book cover"
                    class="unwritten-cover"
                >

            </div>


             <h2>
                THE UNWRITTEN ONE
            </h2>

            <p>
                UMAR
            </p>

            <a href="book.html"
                class="read-button">

                VIEW BOOK →

            </a>

        </article>
    </div>

    </section>

</main>
<div class="book-transition">

    <div class="transition-book">
        ✦
    </div>

    <p>
        OPENING ARCHIVE...
    </p>

</div>

<script src="js/script.js"></script>
</body>

</html>
